<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق وَسْم</title>
    
    <!-- المسار الصحيح والمحلي للأيقونات -->
    <link rel="stylesheet" href="fontawesome/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="splash-screen"></div>
    
    <div class="header" style="display: none;">هذا التطبيق أحد مبادرات جمعية ركاز الشبابية بمحافظة القويعية</div>
    
    <div class="main-container" style="display: none;">
        <!-- الجزء الأيسر: لوحة التحكم -->
        <div class="left-panel">
            <div class="tab-panel">
                <button class="tab-link active" onclick="openTab(event, 'TabImages')"><i class="fas fa-images"></i><span>الصور</span></button>
                <button class="tab-link" onclick="openTab(event, 'TabLogo')"><i class="fas fa-star"></i><span>الشعار</span></button>
                <button class="tab-link" onclick="openTab(event, 'TabTemplate')"><i class="fas fa-clone"></i><span>القالب</span></button>
                <button class="tab-link" onclick="openTab(event, 'TabProcess')"><i class="fas fa-cogs"></i><span>الدمج</span></button>
            </div>

            <!-- تبويب الصور -->
            <div id="TabImages" class="tab-content" style="display: block;">
                <h3><i class="fas fa-images"></i> 1. اختيار الصور</h3>
                <button class="btn" onclick="document.getElementById('imageInput').click()"><i class="fas fa-file-import"></i> اختيار صور متعددة</button>
                <button class="btn accent-btn" id="btn-take-picture"><i class="fas fa-camera"></i> إلتقاط صورة</button>
                <input type="file" id="imageInput" accept="image/jpeg, image/png, image/jpg" multiple hidden>
                <p id="imageCountLabel">0 صورة</p>
                <hr>
                <h4><i class="fas fa-ruler-combined"></i> خيارات حجم الصورة</h4>
                <div class="radio-group">
                    <label><input type="radio" name="imageSizeMode" value="fit_to_template" checked onchange="updateLivePreview()"> مطابقة مقاس الصورة للقالب</label>
                    <label><input type="radio" name="imageSizeMode" value="keep_original" onchange="updateLivePreview()"> إبقاء مقاس الصورة الأصلي</label>
                </div>
            </div>

            <!-- تبويب الشعار -->
            <div id="TabLogo" class="tab-content">
                <h3><i class="fas fa-star"></i> 2. إعدادات الشعار</h3>
                <button class="btn" onclick="document.getElementById('logoInput').click()"><i class="fas fa-upload"></i> اختيار الشعار (PNG)</button>
                <input type="file" id="logoInput" accept="image/png" hidden>
                <p id="logoStatusLabel">لا يوجد شعار</p>
                <div class="control-group">
                    <label for="logoSize"><i class="fas fa-expand-arrows-alt"></i> حجم الشعار: <span id="logoSizeValue">15</span>%</label>
                    <input type="range" id="logoSize" min="5" max="50" value="15" class="slider">
                </div>
                <div class="control-group">
                    <label for="logoOpacity"><i class="fas fa-eye"></i> شفافية الشعار: <span id="logoOpacityValue">100</span>%</label>
                    <input type="range" id="logoOpacity" min="10" max="100" value="100" class="slider">
                </div>
                <div class="control-group">
                    <label for="logoPosition"><i class="fas fa-map-marker-alt"></i> موضع الشعار:</label>
                    <select id="logoPosition">
                        <option value="Bottom-Right">أسفل اليمين</option>
                        <option value="Bottom-Left">أسفل اليسار</option>
                        <option value="Top-Right">أعلى اليمين</option>
                        <option value="Top-Left">أعلى اليسار</option>
                        <option value="Center">المنتصف</option>
                    </select>
                </div>
            </div>

            <!-- تبويب القالب -->
            <div id="TabTemplate" class="tab-content">
                <h3><i class="fas fa-clone"></i> 3. إعدادات القالب</h3>
                <button class="btn" onclick="document.getElementById('templateInput').click()"><i class="fas fa-upload"></i> اختيار القالب</button>
                <input type="file" id="templateInput" accept="image/jpeg, image/png, image/jpg" hidden>
                <p id="templateStatusLabel">لا يوجد قالب</p>
                <div class="control-group">
                    <label for="templateOpacity"><i class="fas fa-eye"></i> شفافية القالب: <span id="templateOpacityValue">100</span>%</label>
                    <input type="range" id="templateOpacity" min="10" max="100" value="100" class="slider">
                </div>
            </div>

             <!-- تبويب الدمج -->
             <div id="TabProcess" class="tab-content">
                <h3><i class="fas fa-cogs"></i> 4. بدء الدمج</h3>
                <button class="btn process-btn" id="processButton"><i class="fas fa-play"></i> بدء معالجة الصور</button>
                <progress id="progressBar" value="0" max="100"></progress>
                <p id="progressLabel">0%</p>
                <button class="btn reset-btn" id="resetButton"><i class="fas fa-trash-alt"></i> إعادة ضبط الكل</button>
            </div>
        </div>

        <!-- الجزء الأيمن: المعاينة -->
        <div class="right-panel">
            <div id="previewArea" class="preview-area">
                <canvas id="previewCanvas"></canvas>
                <span id="previewPlaceholder"><i class="fas fa-photo-video"></i><br>منطقة المعاينة</span>
            </div>
        </div>
    </div>

    <!-- واجهة الكاميرا المنبثقة -->
    <div id="camera-modal" class="modal-overlay">
        <div class="modal-content camera-view">
            <video id="camera-feed" autoplay playsinline></video>
            <canvas id="capture-canvas" style="display:none;"></canvas>
            <div class="modal-buttons">
                <button id="btn-cancel-camera" class="btn reset-btn"><i class="fas fa-times"></i></button>
                <button id="btn-switch-camera" class="btn accent-btn"><i class="fas fa-sync-alt"></i></button>
                <button id="btn-capture-photo" class="btn process-btn"><i class="fas fa-camera"></i></button>
            </div>
        </div>
    </div>

    <!-- واجهة ما بعد المعالجة المنبثقة -->
    <div id="post-process-modal" class="modal-overlay">
        <div class="modal-content">
            <h2><i class="fas fa-check-circle"></i> اكتملت المعالجة</h2>
            <p>تم تحميل الصور بنجاح. ماذا تريد أن تفعل الآن؟</p>
            <div class="modal-buttons">
                <button id="btn-keep-settings" class="btn"><i class="fas fa-save"></i> الاحتفاظ بالإعدادات الحالية</button>
                <button id="btn-reset-after-process" class="btn reset-btn"><i class="fas fa-trash-alt"></i> إعادة ضبط التطبيق</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
